version: 1

name: "python-radar"
description: "Playbook base para proyectos Python del ecosistema AMON orientados a radar, analisis o automatizacion."

applies_to:
  - "scripts Python"
  - "modulos de analisis"
  - "servicios ligeros"
  - "prototipos con logica reusable"

goals:
  - "Mantener estructura clara"
  - "Facilitar QA y debugging"
  - "Evitar mezclar logica, config y outputs"
  - "Preparar crecimiento hacia integracion con otros repos"

recommended_structure:
  - "src/"
  - "tests/"
  - "requirements.txt o pyproject.toml"
  - ".github/workflows/python-ci.yml"
  - "README.md"

agent_flow:
  - "architect define objetivo, limites, riesgos, rollback y criterio de exito"
  - "designer define output UX si aplica"
  - "dev implementa modulo o script en cambios pequenos"
  - "qa valida con lint, tests y smoke manual"
  - "security revisa secrets, dependencias y permisos"
  - "ops asegura CI verde y versionado cuando corresponda"

checklist:
  - "Entradas y salidas definidas"
  - "Sin secretos hardcodeados"
  - "Logs legibles"
  - "Errores manejados"
  - "README actualizado"
  - "Ruff OK"
  - "Pytest OK si hay tests"
  - "Smoke del flujo principal ejecutado"
  - "Salida legible y reproducible"
  - "Dependencias sin alertas criticas"

anti_patterns:
  - "Scripts monoliticos sin separacion"
  - "Variables magicas sin config"
  - "Outputs mezclados con codigo"
  - "Logica experimental en produccion"
