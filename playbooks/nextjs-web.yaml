playbook: nextjs-web
purpose: "Landing/marketing Next.js + Tailwind + UI estable"
steps:
  - "Architect: define alcance y qué NO se toca."
  - "Designer: valida estilo (glass/apple, spacing, contraste)."
  - "Dev: implementa por PR pequeño."
  - "QA: npm ci + lint + build + smoke manual."
  - "Ops: CI ubuntu-latest; preview en Vercel; prod solo con tag."
checks:
  - "No romper diseño actual"
  - "Lighthouse básico (perf/accesibilidad) opcional"
