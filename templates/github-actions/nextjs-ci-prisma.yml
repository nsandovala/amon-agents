name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Prisma Generate (safe)
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          else
            echo "No prisma/schema.prisma found. Skipping prisma generate."
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
        run: npm run build
