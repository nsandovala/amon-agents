name: Python CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          pip install ruff pytest mypy


      - name: Lint (ruff)
        run: |
          ruff check . || (echo "Ruff failed" && exit 1)

      - name: Tests (pytest)
        run: |
          if [ -d tests ] || ls -1 *test*.py >/dev/null 2>&1; then
            pytest -q
          else
            echo "No tests found, skipping."
          fi

      - name: Typecheck (optional mypy)
        run: |
          python -c "import sys; sys.exit(0)"  # placeholder
          if python -c "import mypy" >/dev/null 2>&1; then
            mypy . || (echo "Mypy failed" && exit 1)
          else
            echo "mypy not installed, skipping."
          fi
