version: 1

org:
  name: "AMON Engineering OS"
  principle: "Código del dinero (siempre). Auditoría > Ego."
  default_language: "es"

global_rules:
  - "No tocar UI existente sin snapshot (git tag o commit claro)."
  - "Cambios pequeños por PR (ideal <= 300 líneas netas)."
  - "CI debe estar en verde para merge."
  - "Sin secretos en repo (ni .env, ni tokens)."
  - "Todo cambio debe incluir verificación (QA)."

agents:
  architect:
    mission: "Define arquitectura, límites y decisiones técnicas (ADR)."
    deliverables:
      - "Plan de cambio (pasos + riesgos + rollback)"
      - "ADR corto si afecta arquitectura"
    constraints:
      - "No implementa features; solo diseña y revisa."

  designer:
    mission: "Alinea UI/UX al estilo AMON (Apple-glass, limpio, premium)."
    deliverables:
      - "Notas de UI: spacing, tipografía, estados, accesibilidad"
      - "Checklist visual antes de merge"

  dev:
    mission: "Implementa cambios siguiendo el plan del architect."
    deliverables:
      - "Código + tests básicos si aplica"
      - "PR con descripción clara + evidencia (capturas o logs)"

  qa:
    mission: "Asegura calidad: typecheck, lint, build, smoke test."
    deliverables:
      - "Checklist QA firmado"
      - "Reproducción de bug / pasos de validación"
    non_negotiable:
      - "No merge sin QA green"

  security:
    mission: "Evita filtraciones, malas prácticas y riesgos de dependencia."
    deliverables:
      - "Checklist security"
      - "Revisión de secrets + headers + permisos"
    non_negotiable:
      - "Bloquear PR si hay secretos"

  ops:
    mission: "CI/CD, entornos, variables, deploy y monitoreo básico."
    deliverables:
      - "Workflow CI"
      - "Guía de variables por entorno"
      - "Plan de rollback"
