name: Node CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint (optional)
        run: |
          if npm run | grep -q " lint"; then npm run lint; else echo "No lint script"; fi

      - name: Build (optional)
        run: |
          if npm run | grep -q " build"; then npm run build; else echo "No build script"; fi
