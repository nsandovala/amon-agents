name: python-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          pip install ruff pytest mypy

      - name: Lint (ruff)
        run: |
          if [ -d src ] || [ -d tests ] || ls *.py >/dev/null 2>&1; then
            ruff check .
          else
            echo "No Python files found. Skipping lint."
          fi

      - name: Tests (pytest)
        run: |
          if [ -d tests ] || ls -1 *test*.py >/dev/null 2>&1; then
            pytest -q
          else
            echo "No tests found. Skipping."
          fi

      - name: Typecheck (optional mypy)
        run: |
          if [ -f mypy.ini ] || [ -f setup.cfg ] || [ -f pyproject.toml ]; then
            mypy . || (echo "Mypy failed" && exit 1)
          else
            echo "No mypy config found. Skipping."
          fi
